# Производственный календарь РК на 2026 год.
#
# Источники — только adilet.zan.kz:
#   - Закон РК от 13.12.2001 № 267 «О праздниках в Республике Казахстан»,
#     ст. 2 (национальный праздник), ст. 3 (государственные праздники),
#     ст. 5 (перенос при совпадении с выходным): https://adilet.zan.kz/rus/docs/Z010000267_
#   - Трудовой кодекс РК, ст. 84 п. 5 (Курбан-айт, 7 января):
#     https://adilet.zan.kz/rus/docs/K1500000414
#
# ВАЖНО про 30 августа. День Конституции РК перенесён в ст. 3 в редакции
# Закона от 11.06.2026 № 306-VIII с 30 августа на 15 марта, но поправка
# вступает в силу только с 01.07.2026. Редакция, проверенная в архиве
# adilet на 19.04.2023 (действовала до 01.07.2026), называет датой
# 30 августа. Обе даты в 2026 году оказываются вне действия нормы,
# которая их устанавливает: 15 марта 2026 уже прошло к моменту вступления
# поправки в силу, а 30 августа 2026 наступает уже после того как поправка
# вступила в силу и старую дату отменила. Праздник в 2026 году физически
# не отмечается ни в марте, ни в августе — это не пропуск, а проверенный
# результат сверки двух редакций закона.
#
# Курбан-айт (лунный календарь, дата 2026 года — 27 мая) не входит
# в ст. 3, это отдельное основание по ст. 84 п. 5 Трудового кодекса;
# дата подтверждена независимо несколькими новостными источниками,
# первоисточника с точной календарной датой на adilet нет по определению
# лунного календаря.

year: 2026

holidays:
  - date: 2026-01-01
    name: "Новый год"
  - date: 2026-01-02
    name: "Новый год"
  - date: 2026-03-08
    name: "Международный женский день"
  - date: 2026-03-21
    name: "Наурыз мейрамы"
  - date: 2026-03-22
    name: "Наурыз мейрамы"
  - date: 2026-03-23
    name: "Наурыз мейрамы"
  - date: 2026-05-01
    name: "Праздник единства народа Казахстана"
  - date: 2026-05-07
    name: "День защитника Отечества"
  - date: 2026-05-09
    name: "День Победы"
  - date: 2026-05-27
    name: "Курбан айт (первый день)"
  - date: 2026-07-06
