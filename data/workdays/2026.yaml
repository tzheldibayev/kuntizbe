# Перенос выходного дня, чей отдых «поглощён» совпадением с праздником,
# на ближайший рабочий день (Закон о праздниках, ст. 5). 21–22 марта —
# особый случай: оба выходных дня Наурыза (суббота и воскресенье) сами
# уже праздничные дни, поэтому недополученный еженедельный отдых
# переносится на 24 и 25 марта, создавая непрерывный блок 21–25 марта.
transfers:
  - from: 2026-03-08
    to: 2026-03-09
    kind: rest
  - from: 2026-03-21
    to: 2026-03-24
    kind: rest
  - from: 2026-03-22
    to: 2026-03-25
    kind: rest
  - from: 2026-05-09
    to: 2026-05-11
    kind: rest
  - from: 2026-10-25
    to: 2026-10-26
    kind: rest
