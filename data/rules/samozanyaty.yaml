# СНР для самозанятых (НК РК, глава 77, ст. 718–721).
#
# ОПВ, ОПВР, социальные отчисления и ВОСМС — четыре разных обязательства
# по разным законам, но с одним и тем же сроком уплаты и одной и той же
# аудиторией, поэтому сведены в одно правило (EVENTS.md, блок A).
#
# ИПН к этому же сроку формально относится (НК РК ст. 720 п. 4), но ставка
# 0% (ст. 720 п. 1) — реального платежа никогда не будет, правила для него
# нет и не будет.
#
# Отдельной отчётности режим не предусматривает (НК РК ст. 719 п. 2: учёт
# ведётся автоматически в мобильном приложении) — события «сдача» для
# блока A в каталоге нет.

- id: snr-self-employed-social
  title: "Социальные платежи самозанятого — ОПВ, ОПВР, СО, ВОСМС"
  applies_when:
    regime: [snr-self-employed]
  period: month
  window_opens: null
  due:
    months_after_period_end: 1
    day: 25
  shift: next-working-day
  source: "Соцкодекс РК, ст. 101-1 п. 3–5, 10; НК РК, ст. 720 п. 4; Закон об ОСМС, ст. 28 п. 3, ст. 30 п. 3-3"
  source_url: "https://adilet.zan.kz/rus/docs/K2300000224#z3538"
  updated: 2026-08-11
  note: >
    ОПВ, ОПВР и социальные отчисления — по 1% от дохода за отчётный месяц
    (Соцкодекс ст. 101-1 п. 4, 5, 3). ВОСМС — 1% от дохода (Закон об ОСМС
    ст. 28 п. 3, применительно к самозанятым по пп. 3-1 п. 2 ст. 14 того же
    закона). Срок для всех четырёх — не позднее 25 числа месяца,
    следующего за отчётным.
