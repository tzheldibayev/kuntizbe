# ИП на СНР на основе упрощённой декларации (НК РК, глава 78, ст. 722–727).
#
# Сдача и уплата по форме 910.00 — отдельные события с разными датами
# (EVENTS.md, блок B, правило проекта: сдача/уплата не совпадают).
# Обе даты явно закреплены в одной статье (ст. 727), поэтому окно подачи
# снизу не ограничено — window_opens не задан ни у одного из двух правил.
#
# Ежемесячные ОПВ, СО и ВОСМС «за себя» — три обязательства с общим сроком,
# сведены в одно правило по аналогии с snr-self-employed-social
# (data/rules/samozanyaty.yaml). В отличие от самозанятых, ОПВР
# (пенсионный взнос работодателя) у ИП за себя нет — эта форма участия
# распространяется только на самозанятых (Соцкодекс ст. 101-1 п. 5).
# Каждое из трёх обязательств установлено своим законом с собственной
# формулировкой срока, но у всех — «не позднее 25 числа месяца, следующего
# за отчётным», без ссылки на перенос при выходном. Перенос применён по
# той же логике, что и для блока A: см. комментарий в samozanyaty.yaml
# и уточнение НК РК ст. 64 п. 2 в SPEC.md §5 — открытый вопрос не
# переисследован здесь заново, решение уже принято на Этапе 1.
#
# Правило ограничено осями form: [ip] + regime: [snr-simplified] — сами
# нормы (Соцкодекс, Закон об ОСМС) не различают налоговый режим ИП, но
# для ТОО на упрощёнке и для ИП на общеустановленном режиме (блок D)
# применимость не проверена, оставлено для следующих этапов (PLAN.md).

- id: fno-910-00
  title: "ФНО 910.00 — упрощённая декларация"
  applies_when:
    regime: [snr-simplified]
  period: half-year
  window_opens: null
  due:
    months_after_period_end: 2
    day: 15
  shift: next-working-day
  source: "НК РК, ст. 727 п. 1"
  source_url: "https://adilet.zan.kz/rus/docs/K2500000214#z11967"
  updated: 2026-08-11
  note: >
    Упрощённая декларация подаётся раз в полугодие, не позднее 15 числа
    второго месяца, следующего за отчётным периодом (НК РК ст. 727 п. 1).
    Отражает доход от деятельности и исчисление ИПН/КПН по ставке 4%
    (НК РК ст. 726).

- id: fno-910-00-payment
  title: "ФНО 910.00 — уплата ИПН (КПН) по декларации"
  applies_when:
    regime: [snr-simplified]
  period: half-year
  window_opens: null
  due:
    months_after_period_end: 2
    day: 25
  shift: next-working-day
  source: "НК РК, ст. 727 п. 2"
  source_url: "https://adilet.zan.kz/rus/docs/K2500000214#z11967"
  updated: 2026-08-11
  note: >
    Уплата ИПН (для ИП) или КПН (для ТОО), исчисленных в упрощённой
    декларации, — не позднее 25 числа второго месяца, следующего за
    отчётным периодом (НК РК ст. 727 п. 2). Отдельно от срока сдачи
    декларации, разрыв 10 дней.

- id: ip-uproshchenka-social
  title: "Социальные платежи ИП за себя — ОПВ, СО, ВОСМС"
  applies_when:
    form: [ip]
    regime: [snr-simplified]
  period: month
  window_opens: null
  due:
    months_after_period_end: 1
    day: 25
  shift: next-working-day
  source: "Соцкодекс РК, ст. 246 п. 1, ст. 248 п. 9 пп. 2), ст. 249 п. 1 пп. 2); Закон об ОСМС, ст. 28 п. 3, ст. 30 п. 6 пп. 2)"
  source_url: "https://adilet.zan.kz/rus/docs/K2300000224#z3146"
  updated: 2026-08-11
  note: >
    ОПВ и социальные отчисления — 10% и 5% соответственно от дохода,
    определяемого ИП самостоятельно для целей уплаты (Соцкодекс ст. 249
    п. 1 пп. 2), ст. 244 п. 1). ВОСМС — 5% от 1,4-кратного МЗП (Закон об
    ОСМС ст. 28 п. 3, п. 5). Срок для всех трёх — не позднее 25 числа
    месяца, следующего за отчётным. В отличие от самозанятых, ОПВР
    (взнос работодателя за себя) для ИП законом не предусмотрен.
